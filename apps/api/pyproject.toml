[project]
name = "voice-agent-api"
version = "0.1.0"
description = "FastAPI backend for the Voice Agent Sandbox: fictional business data and deterministic availability."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "langchain-core~=1.6.6",
    "langgraph~=1.2.12",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "tzdata>=2026.4",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real PostgreSQL database (apps/api/.env). Run with `-m integration`.",
]
# Integration tests write to a real database, so they never run unless asked for.
addopts = '-m "not integration"'
